<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camalot</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--cm-mana-deep) 35%, var(--cm-stage)), var(--cm-stage) 70%) fixed, var(--cm-stage);
        color: var(--cm-ink);
        font: 500 18px/1.4 var(--cm-ui);
      }
      .hub { box-sizing: border-box; max-width: 1100px; margin: 0 auto; padding: 16px; }
      .hub * { box-sizing: border-box; }
      .hub-top { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 20px; }
      .hub-top .cm-title { font-size: 32px; margin-right: auto; }
      .hub-player { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      .hub-player span { white-space: nowrap; }
      .hub-player .cm-dot { width: 24px; height: 24px; }
      .hub-name { font-weight: 700; }
      .hub-grade { color: var(--cm-ink-dim); }
      .hub-games { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
      .hub-game { width: 100%; min-height: 150px; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; padding: 20px 22px 24px; text-align: left; }
      .hub-game .cm-dot { width: 32px; height: 32px; margin-bottom: auto; }
      .hub-game-name { font: 700 28px/1.1 var(--cm-display); letter-spacing: 0.03em; }
      .hub-game-tag { font-size: 18px; font-weight: 500; }
      @media (max-width: 520px) { .hub-games { grid-template-columns: 1fr; } .hub-game { min-height: 110px; } }
    </style>
  </head>
  <body>
    <div class="hub">
      <header class="cm-panel hub-top">
        <h1 class="cm-title">Camalot</h1>
        <div class="hub-player" id="player"></div>
      </header>
      <main>
        <ul class="hub-games">
          <li><a class="cm-btn hub-game" href="games/wyrm/index.html"><span class="cm-dot" style="--sw: #5fd35f"></span><span class="hub-game-name">Wyrm</span><span class="hub-game-tag">Eat the glowing gems</span></a></li>
          <li><a class="cm-btn hub-game" href="games/hole/index.html"><span class="cm-dot" style="--sw: #b36bff"></span><span class="hub-game-name">Hole</span><span class="hub-game-tag">Swallow the kingdom</span></a></li>
          <li><a class="cm-btn hub-game" href="games/tractor/index.html"><span class="cm-dot" style="--sw: #ffa530"></span><span class="hub-game-name">Tractor</span><span class="hub-game-tag">Farm with a cat</span></a></li>
          <li><a class="cm-btn hub-game" href="games/match3/index.html"><span class="cm-dot" style="--sw: #ff4a4a"></span><span class="hub-game-name">Match</span><span class="hub-game-tag">Match three, build a castle</span></a></li>
          <li><a class="cm-btn hub-game" href="games/runner/index.html"><span class="cm-dot" style="--sw: #4a9cff"></span><span class="hub-game-name">Runner</span><span class="hub-game-tag">Run the gates to the goal</span></a></li>
          <li><a class="cm-btn hub-game" href="games/trail/index.html"><span class="cm-dot" style="--sw: #8fe8ff"></span><span class="hub-game-name">Trail</span><span class="hub-game-tag">Ski to claim the mountain</span></a></li>
        </ul>
      </main>
    </div>
    <script type="module" src="/src/core/hub.ts"></script>
  </body>
</html>
